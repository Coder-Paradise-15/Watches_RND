name: Live Stream Android 15 VM (Solid Core Pipeline)

on: [push, pull_request]

jobs:
  launch-pure-android-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up clean target runtime layers
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Configures structural hardware acceleration permissions on bare-metal host kernel
      - name: Configure Linux KVM Hardware Driver
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 2. Installs core streaming components and port managers
      - name: Install Pure Linux Desktop Rendering & Management Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y tightvncserver websockify novnc jq curl psmisc
          sudo npm install -g localtunnel

      # 3. Mounts the network proxy layer in the host backdrop BEFORE firing the emulator
      # This guarantees that localtunnel grabs the socket cleanly without timing out
      - name: Pre-Launch Proxy Bridge (localtunnel)
        run: |
          echo "========================================================="
          echo "🔑 YOUR ACCESS PASSWORD (RUNNER PUBLIC IP):"
          curl -s https://ifconfig.me
          echo -e "\n========================================================="
          
          # Initialize the proxy link mapping port 6080 into a local log file
          lt --port 6080 > host_lt_url.txt &
          
          # Let the network capture the routing tables
          sleep 5
          echo "========================================================="
          echo "🎯 CLICK THE LINK BELOW TO ACCESS YOUR ANDROID 15 VM:"
          echo "========================================================="
          cat host_lt_url.txt
          echo "========================================================="

      # 4. Boots the Android 15 VM directly inside the action's standard window mapping
      - name: Attach Streaming Server to Android 15 Frame
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          # ⚡ SOLID CONFIG 1: Drop "-no-window" so the action provisions the graphics layer (:1) natively
          emulator-options: -gpu swiftshader_indirect -no-audio -no-snapshot -no-boot-anim
          
          # ⚡ SOLID CONFIG 2: Inject VNC and WebSockets right into the action's active display layer
          script: |
            echo "⚡ Interfacing with active display: $DISPLAY"
            adb devices
            
            echo "🔒 Generating local VNC authentication records..."
            mkdir -p ~/.vnc
            echo "password" | vncpasswd -f > ~/.vnc/passwd
            chmod 600 ~/.vnc/passwd
            
            echo "🔥 Cleaning up any conflicting background locks..."
            tightvncserver -kill :1 || true
            sudo fuser -k 6080/tcp || true
            sudo fuser -k 5901/tcp || tcp
            
            echo "🔒 Launching interactive server on primary display channel..."
            # Hooks VNC directly to display slot :1 (which maps to VNC port 5901)
            tightvncserver :1 -geometry 1080x1920 -depth 24
            
            echo "🌐 Converting visual outputs to browser-compliant format..."
            # Transmutes VNC port 5901 to the HTML rendering slot on port 6080
            websockify --web=/usr/share/novnc/ 6080 localhost:5901 &
            sleep 5
            
            echo "⏱️ Android 15 Virtual Machine is fully live. Enjoy your session!"
            sleep 3600
