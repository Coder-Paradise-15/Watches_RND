name: Live Stream Android 15 VM (Pure OS - Extended Runtime)

on: [push, pull_request]

jobs:
  launch-pure-android-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure Linux KVM Hardware Driver
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Pure Linux Desktop Rendering & Management Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tightvncserver websockify novnc jq curl psmisc

      # Launches Android 15 and hooks it straight to the web VNC encoder channels
      - name: Run Android 15 Emulator Frame
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-snapshot -no-boot-anim
          
          # ⚡ CRITICAL FIX: Every line ends with a semicolon and backslash (\) 
          # This forces the action to run everything inside ONE single shell process.
          script: |
            echo "🔥 RUNNING PORT PURGER ENGINE..." ; \
            sudo fuser -k 6080/tcp || true ; \
            sudo fuser -k 5999/tcp || true ; \
            sudo fuser -k 5554/tcp || true ; \
            sudo fuser -k 5555/tcp || true ; \
            sudo rm -f /tmp/.X99-lock || true ; \
            sudo rm -f /tmp/.X11-unix/X99 || true ; \
            tightvncserver -kill :99 || true ; \
            adb devices ; \
            echo "🎨 Setting up headless display buffer on slot :99..." ; \
            Xvfb :99 -screen 0 1080x1920x24 & \
            export DISPLAY=:99 ; \
            sleep 3 ; \
            echo "🔒 Initializing local VNC capture frame..." ; \
            mkdir -p ~/.vnc ; \
            echo "password" | vncpasswd -f > ~/.vnc/passwd ; \
            chmod 600 ~/.vnc/passwd ; \
            tightvncserver :99 -geometry 1080x1920 -depth 24 ; \
            echo "🌐 Converting VNC sockets to browser-friendly WebSockets..." ; \
            websockify --web=/usr/share/novnc/ 6080 localhost:5999 & \
            sleep 5 ; \
            echo "=========================================================" ; \
            echo "🔑 YOUR ACCESS PASSWORD (RUNNER PUBLIC IP):" ; \
            curl -s https://ifconfig.me ; \
            echo -e "\n=========================================================" ; \
            echo "🚀 MOUNTING LOCALTUNNEL PROXY BRIDGE..." ; \
            npm install -g localtunnel ; \
            lt --port 6080 > lt_url.txt & \
            for i in {1..5}; do \
              if [ -s lt_url.txt ]; then \
                break ; \
              fi ; \
              sleep 3 ; \
            done ; \
            echo "=========================================================" ; \
            echo "🎯 CLICK THE LINK BELOW TO STREAM YOUR ANDROID 15 VM:" ; \
            echo "=========================================================" ; \
            cat lt_url.txt ; \
            echo "=========================================================" ; \
            echo "⏱️ Holding VM stream active for 1 Hour. Enjoy debugging!" ; \
            sleep 3600
