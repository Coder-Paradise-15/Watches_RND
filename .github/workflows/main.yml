name: Android Instrumented Tests

on: [push, pull_request]

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # Caches your dependencies so subsequent runs build much faster
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ⚡ NEW STEP: Generates the missing 'gradlew' wrapper script inside the container
      - name: Bootstrap Missing Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew

      # Grants execution permissions to KVM on the GitHub runner
      - name: Enable KVM Group Permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Deploys a stable, low-overhead Android 10 Environment
      - name: Run Lightweight Android 10 Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default         
          profile: Nexus 4        
          disable-animations: true
          
          # Forces CPU software rendering to work headlessly on the cloud backend
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          
          script: |
            adb devices
            ./gradlew connectedCheck --no-daemon
