name: Live Stream Android 15 VM (Pure OS - No Docker/Ngrok)

on: [push, pull_request]

jobs:
  launch-pure-android-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup proper Java runtime environments
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. Setup Node environment to execute localtunnel binaries
      - name: Set up Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Configure hardware nested virtualization extensions (KVM)
      - name: Configure Linux KVM Hardware Driver
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 4. Install a headless graphical buffer, VNC framework, and audio null-sinks
      - name: Install Pure Linux Desktop Rendering Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb tightvncserver websockify novnc jq curl

      # 5. Launches Android 15 and hooks it straight to the web VNC encoder channels
      - name: Run Android 15 Emulator Frame
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          
          # Render onto virtual screen index :1 using local software rendering pipes
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-snapshot -no-boot-anim
          
          script: |
            adb devices
            
            echo "🎨 Setting up headless display buffer..."
            Xvfb :1 -screen 0 1080x1920x24 &
            export DISPLAY=:1
            sleep 3
            
            echo "🔒 Initializing local VNC capture frame..."
            # Launch VNC background manager mapping display :1 onto port 5901
            mkdir -p ~/.vnc
            echo "password" | vncpasswd -f > ~/.vnc/passwd
            chmod 600 ~/.vnc/passwd
            tightvncserver :1 -geometry 1080x1920 -depth 24
            
            echo "🌐 Converting VNC sockets to browser-friendly WebSockets..."
            # Websockify maps raw VNC stream port 5901 into noVNC web layout on port 6080
            websockify --web=/usr/share/novnc/ 6080 localhost:5901 &
            sleep 5
            
            echo "========================================================="
            echo "🔑 YOUR ACCESS PASSWORD (RUNNER PUBLIC IP):"
            curl -s https://ifconfig.me
            echo -e "\n========================================================="
            
            echo "🚀 DOWNLOADING AND MOUNTING LOCALTUNNEL PROXY BRIDGE..."
            echo "========================================================="
            echo "🎯 CLICK THE LINK BELOW TO STREAM YOUR ANDROID 15 VM:"
            echo "========================================================="
            npm install -g localtunnel
            
            # Starts localtunnel listening on port 6080 and pauses the pipeline for 15 minutes
            lt --port 6080 &
            
            echo "⏱️ Holding VM stream active for 15 minutes. Use the proxy link above!"
            sleep 900
