name: Android Instrumented Tests

on: [push, pull_request]

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM Group Permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator and Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default         
          profile: Nexus 4        
          disable-animations: true
          
          # ⚡ FIX: Combined flags to resolve the crash:
          # 1. -gpu host: Leverages KVM translation directly instead of buggy swiftshader emulation layers
          # 2. -no-metrics: Stops the blocking metrics warning message logged right before your crash
          # 3. -memory 2048: Tells the AVD manager to strictly cap the layout footprint
          emulator-options: -no-window -gpu host -no-snapshot -noaudio -no-boot-anim -no-metrics -memory 2048
          
          script: |
            chmod +x ./gradlew
            adb devices
            
            # ⚡ FIX: Forces the Gradle test runner to execute with minimized memory settings
            ./gradlew connectedCheck -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=384m" --no-daemon
