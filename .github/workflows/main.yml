name: Create Android 15 Emulator

on: [push, pull_request]

jobs:
  run-emulator:
    # Requires Linux for KVM acceleration support
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Optimizes build speeds so the workflow doesn't time out
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Crucial step: Grants execution permissions to KVM on the runner
      - name: Enable KVM Permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Creates, boots, and operates the Android 15 Emulator
      - name: Run Android 15 Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6              # Specifies a modern device dimension mapping
          disable-animations: true     # Recommended to prevent flaky UI testing
          
          # Put the commands or scripts you want to run inside the emulator here
          script: |
            adb devices
            ./gradlew connectedCheck
