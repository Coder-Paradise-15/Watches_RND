name: Android Instrumented Tests

on: [push, pull_request]

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Uses the latest v5 action to avoid deprecation warnings
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # Activates smart dependency caching so steps don't time out
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Grants the runner access to the host's Linux hardware acceleration (KVM)
      - name: Enable KVM Group Permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Deploys the ultra-lightweight Android Test Development Image
      - name: Run Guaranteed ATD Emulator and Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          # ⚡ GUARANTEED STABILITY: Drops all UI overhead to run strictly on headless test binaries
          target: aosp_atd        
          profile: Nexus 4        
          disable-animations: true
          # Use headless hardware pass-through mode to skip heavy OpenGL software emulation layers
          emulator-options: -no-window -gpu host -no-snapshot -noaudio -no-boot-anim -no-metrics
          
          script: |
            chmod +x ./gradlew
            adb devices
            
            # Limits the compilation engine's RAM so it never collides with the emulator's memory space
            ./gradlew connectedCheck -Dorg.gradle.jvmargs="-Xmx1536m -XX:MaxMetaspaceSize=384m" --no-daemon
