name: Android Instrumented Tests

on: [push, pull_request]

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set up clean target runtime layers
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Forces Gradle to generate build infrastructure configuration layers safely
      - name: Bootstrap Missing Gradle Build and Wrapper
        run: |
          gradle init --type basic --dsl groovy --use-defaults --overwrite
          gradle wrapper --gradle-version 8.7
          chmod +x ./gradlew

      - name: Enable KVM Group Permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Boots the ultra-stable, cloud-safe Android 10 virtualization engine
      - name: Run Lightweight Android 10 Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default         
          profile: Nexus 4        
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          
          # ⚡ FIX: Uses standard single-line instructions to pinpoint files safely
          script: |
            adb devices
            
            echo "=== 🔎 REPOSITORY BLUEPRINT DETAILS ==="
            find . -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle"
            
            echo "=== 📋 REGISTERED GRADLE SUBPROJECTS ==="
            ./gradlew projects --no-daemon
