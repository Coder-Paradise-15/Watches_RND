name: Android Instrumented Tests

on: [push, pull_request]

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM Group Permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Deploys a stable, low-overhead Android 10 Environment
      - name: Run Lightweight Android 10 Emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          # Pure baseline Android image with zero custom UI layouts or background bloat
          target: default         
          profile: Nexus 4        
          disable-animations: true
          
          # ⚡ FIX: Forces CPU software rendering so it runs headlessly without looking for a display card
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          
          script: |
            chmod +x ./gradlew
            adb devices
            ./gradlew connectedCheck --no-daemon
