name: Android Instrumented Tests

on: [push, pull_request]

jobs:
  instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Optimizes Gradle build speed and avoids emulator timeouts
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Required for hardware-accelerated nested virtualization on Ubuntu runners
      - name: Enable KVM Group Permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator and Tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          # Standard hardware profile to ensure the UI fits comfortably in memory
          profile: Nexus 6
          # Disable animations for faster, more stable UI tests
          disable-animations: true
          script: ./gradlew connectedCheck
